name: Android CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, lint and debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install pinned SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Validate wrapper and configure Gradle cache
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Run unit tests, lint and assemble APK
        run: ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Save test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-verification-${{ github.sha }}
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14
      - name: Save installable development APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: brewdoro-android-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Add verification summary
        if: always()
        shell: python
        run: |
          import glob, os, xml.etree.ElementTree as ET
          tests = failures = errors = skipped = 0
          for path in glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml'):
              root = ET.parse(path).getroot()
              tests += int(root.get('tests', 0))
              failures += int(root.get('failures', 0))
              errors += int(root.get('errors', 0))
              skipped += int(root.get('skipped', 0))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(f'## Brewdoro Android verification\n\nUnit tests: {tests}, failures: {failures}, errors: {errors}, skipped: {skipped}.\n\n')
              output.write('Artifacts include reports and, on success, a debug-signed APK. No real-phone verification or production release is implied.\n')
